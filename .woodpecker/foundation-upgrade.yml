when:
  - event: manual
    branch: main

labels:
  target: production
  repo: uptonking/llm-hub-lite

concurrency:
  limit: 1
  group: production

steps:
  - name: validate
    image: llm-hub-lite/deploy-runner:current
    pull: false
    commands:
      - STACK_ENV_FILE=.env.prod.example STACK_RUNTIME_ROOT=.runtime/ci STACK_IMAGE_ENV_FILE=ops/images.apps.prod.env STACK_FOUNDATION_IMAGE_ENV_FILE=ops/images.foundation.prod.env ./stack.sh prod validate
      - platform-compose --env-file .env.prod.example --env-file ops/foundation/woodpecker.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/woodpecker.yml config --quiet
      - platform-compose --env-file .env.prod.example --env-file ops/foundation/beszel.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/beszel.yml config --quiet

  - name: upgrade
    image: llm-hub-lite/deploy-runner:current
    pull: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/apps/llm-hub-lite:/opt/apps/llm-hub-lite
      - /opt/platform:/opt/platform
      - /opt/backups/llm-hub-lite:/opt/backups/llm-hub-lite
      - /run/lock/llm-hub-lite:/run/lock/llm-hub-lite
      - /etc/llm-hub-lite:/etc/llm-hub-lite
      - /usr/local/bin/deploy-controller:/usr/local/bin/deploy-controller:ro
      - /usr/local/bin/backup-platform:/usr/local/bin/backup-platform:ro
      - /usr/local/bin/platform-submit:/usr/local/bin/platform-submit:ro
    commands:
      - /usr/local/bin/platform-submit foundation-upgrade "$CI_COMMIT_SHA"

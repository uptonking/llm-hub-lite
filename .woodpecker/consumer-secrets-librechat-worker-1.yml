      - /usr/local/bin/platformctl:/usr/local/bin/platformctl:ro
      - /usr/local/bin/configure-app-secrets:/usr/local/bin/configure-app-secrets:ro
    environment:
      LIBRECHAT_MONGO_URI:
        from_secret: librechat_mongo_uri
      LIBRECHAT_REDIS_URI:
        from_secret: librechat_redis_uri
      LIBRECHAT_JWT_SECRET:
        from_secret: librechat_jwt_secret
      LIBRECHAT_JWT_REFRESH_SECRET:
        from_secret: librechat_jwt_refresh_secret
      LIBRECHAT_ADMIN_PANEL_SESSION_SECRET:
        from_secret: librechat_admin_panel_session_secret
      LIBRECHAT_AWS_ENDPOINT_URL:
        from_secret: librechat_aws_endpoint_url
      LIBRECHAT_AWS_ACCESS_KEY_ID:
        from_secret: librechat_aws_access_key_id
      LIBRECHAT_AWS_SECRET_ACCESS_KEY:
        from_secret: librechat_aws_secret_access_key
      LIBRECHAT_AWS_BUCKET_NAME:
        from_secret: librechat_aws_bucket_name
      LIBRECHAT_OPENROUTER_KEY:
        from_secret: LIBRECHAT_OPENROUTER_KEY
    commands:
      - /usr/local/bin/configure-app-secrets librechat --target-node worker-1 --non-interactive

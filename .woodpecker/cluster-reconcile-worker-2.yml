# generated by ops/generate-woodpecker-workflows.sh; do not edit
when:
  - event: push
    branch: main
    path:
      include:
        - config/cluster/policy.env
        - config/cluster/nodes/**
        - config/cluster/apps/librechat.policy
        - config/cluster/apps/newapi.policy
        - config/cluster/apps/pigeon.policy

depends_on:
  - cluster-reconcile-worker-1

labels:
  node: worker-2
  deployment: "true"
  target: production
  repo: uptonking/llm-hub-lite

concurrency:
  limit: 1
  group: llm-hub-lite-deployment

steps:
  reconcile:
    image: llm-hub-lite/deploy-runner:current
    pull: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/apps/llm-hub-lite:/opt/apps/llm-hub-lite
      - /opt/platform:/opt/platform
      - /opt/backups/llm-hub-lite:/opt/backups/llm-hub-lite
      - /run/lock/llm-hub-lite:/run/lock/llm-hub-lite
      - /etc/llm-hub-lite:/etc/llm-hub-lite
      - /usr/local/bin/platform-submit:/usr/local/bin/platform-submit:ro
    commands:
      - |
        grep -Fq 'verify_cluster_scope()' /opt/platform/control/current/ops/deploy-controller.sh || {
          printf '%s\n' 'installed deploy controller is too old for safe automatic cluster reconciliation; run the reviewed foundation-upgrade chain, then restart this workflow' >&2
          exit 1
        }
      - DEPLOY_SKIP_SINGLETONS=1 /usr/local/bin/platform-submit cluster-reconcile "$CI_COMMIT_SHA"

skip_clone: true
when:
  - event: push
    branch: main
    path:
      include:
        - apps/cpapi/**
        - config/cluster/apps/cpapi.policy
        - config/cluster/overrides/**/cpapi.env
        - apps/cpapi/route*.caddy
        - apps/cpapi/images.lock.env
      on_empty: false

depends_on:
  - consumer-stage-cpapi-worker-1
  - control-sync-leader
  - name: foundation-reconcile-leader
    optional: true
  - name: cluster-reconcile-leader
    optional: true

labels:
  node: leader
  deployment: "true"
  target: production
  repo: uptonking/llm-hub-lite

concurrency:
  limit: 1
  group: llm-hub-lite-node-leader

steps:
  publish:
    image: llm-hub-lite/deploy-runner:current
    pull: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/apps/llm-hub-lite:/opt/apps/llm-hub-lite
      - /opt/platform:/opt/platform
      - /opt/backups/llm-hub-lite:/opt/backups/llm-hub-lite
      - /run/lock/llm-hub-lite:/run/lock/llm-hub-lite
      - /etc/llm-hub-lite:/etc/llm-hub-lite
      - /usr/local/bin/platform-submit:/usr/local/bin/platform-submit:ro
      - /usr/local/bin/platformctl:/usr/local/bin/platformctl:ro
      - /usr/local/bin/configure-app-secrets:/usr/local/bin/configure-app-secrets:ro
      - /usr/local/bin/configure-firewall:/usr/local/bin/configure-firewall:ro
      - /opt/platform/control/current/ops/git-auth.sh:/usr/local/bin/git-auth.sh:ro
    commands:
      - if ! test -n "$CI_COMMIT_SHA" || ! printf "%s" "$CI_COMMIT_SHA" | grep -Eq "^[0-9a-f]{40}$"; then printf "CI_COMMIT_SHA must be a full 40-character lowercase commit SHA\\n" >&2; exit 2; fi; DEPLOY_DEBUG_LEVEL=off CONSUMER_APP_ID=cpapi /usr/local/bin/platform-submit consumer-publish "$CI_COMMIT_SHA"

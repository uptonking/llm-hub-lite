name: validate
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check shell syntax
        run: bash -n stack.sh ops/*.sh ops/tests/*.sh compose/foundation/observer-log-proxy-entrypoint.sh
      - name: Check generated Woodpecker workflows
        run: ops/generate-woodpecker-workflows.sh --check
      - name: Lint shell scripts
        run: shellcheck stack.sh ops/*.sh ops/tests/*.sh compose/foundation/observer-log-proxy-entrypoint.sh
      - name: Check IP privacy
        run: ops/tests/ip-privacy-test.sh
      - name: Run fast test suites
        env:
          TEST_PARALLELISM: 2
        run: ops/tests/run-all.sh fast
  deployment-matrix:
    # This suite creates Git worktrees and exercises rollback transactions; run
    # it on its own runner so it cannot contend with platformctl's matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run deployment rollback tests
        run: ops/tests/deployment-rollback-test.sh
  platformctl-matrix:
    # platformctl validation is intentionally serialized inside the test, but
    # isolated from deployment tests to reduce CI wall-clock time.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run platform controller tests
        run: ops/tests/platformctl-test.sh
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEW_API_SITE: https://newapi.example.invalid
      AICHOROUTER_SITE: https://aichorouter.example.invalid
      CPAPI_SITE: https://cpapi.example.invalid
      CURSORAPI_SITE: https://cursorapi.example.invalid
      LIBRECHAT_SITE: https://chat.example.invalid
      LIBRECHAT_ADMIN_SITE: https://chat-admin.example.invalid
      PIGEON_SITE: https://pigeon.example.invalid
      AICHOROUTER_SESSION_SECRET: ci-aichorouter-session-secret
      AICHOROUTER_CRYPTO_SECRET: ci-aichorouter-crypto-secret
      CPAPI_API_KEY: ci-cpapi-api-key
      CPAPI_MANAGEMENT_KEY: ci-cpapi-management-key
      CURSORAPI_CURSOR_API_KEY: ci-cursor-account-key
      CURSORAPI_BRIDGE_API_KEY: ci-cursor-bridge-key
      NEW_API_CRYPTO_SECRET: ci-new-api-crypto-secret
      NEW_API_SESSION_SECRET: ci-new-api-session-secret
      NEW_API_SQL_DSN: postgres://ci:ci@example.invalid/ci
      LIBRECHAT_ADMIN_PANEL_SESSION_SECRET: ci-librechat-admin-secret
      LIBRECHAT_AWS_ACCESS_KEY_ID: ci-access-key
      LIBRECHAT_AWS_SECRET_ACCESS_KEY: ci-secret-key
      LIBRECHAT_AWS_BUCKET_NAME: ci-bucket
      LIBRECHAT_AWS_ENDPOINT_URL: https://storage.example.invalid
      LIBRECHAT_JWT_SECRET: ci-librechat-jwt-secret
      LIBRECHAT_JWT_REFRESH_SECRET: ci-librechat-refresh-secret
      LIBRECHAT_MONGO_URI: mongodb://ci:ci@example.invalid:27017/ci
      LIBRECHAT_REDIS_URI: rediss://default:ci@example.invalid:6379
      PIGEON_SECRET_KEY: ci-pigeon-secret-key
      PIGEON_LOGIN_PASSWORD: ci-pigeon-login-password
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose model
        run: |
          docker compose --env-file .env.prod.example --env-file ops/images.foundation.prod.env -f compose/foundation/caddy.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/leader.env --env-file ops/foundation/woodpecker.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/woodpecker-controller.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/leader.env --env-file ops/foundation/woodpecker.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/woodpecker-deployer.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/leader.env --env-file ops/foundation/beszel.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/beszel-controller.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/leader.env --env-file ops/foundation/beszel.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/beszel-worker.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/leader.env --env-file ops/foundation/observer.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/observer-controller.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/leader.env --env-file ops/foundation/observer.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/observer-collector.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/worker-1.env --env-file ops/foundation/woodpecker.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/woodpecker-worker.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/worker-1.env --env-file ops/foundation/beszel.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/beszel-worker.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/worker-1.env --env-file ops/images.apps.prod.env -f apps/newapi/compose.yml config --quiet
          docker compose --env-file .env.prod.example --env-file ops/images.apps.prod.env -f apps/aichorouter/compose.yml config --quiet
          docker compose --env-file .env.prod.example --env-file ops/images.apps.prod.env -f apps/cpapi/compose.yml config --quiet
          docker compose --env-file .env.prod.example --env-file ops/images.apps.prod.env -f apps/cursorapi/compose.yml config --quiet
          docker compose --env-file .env.prod.example --env-file config/cluster/nodes/worker-1.env --env-file ops/images.apps.prod.env -f apps/librechat/compose.yml config --quiet
          PIGEON_SECRET_KEY=validation-secret-key-which-is-long PIGEON_LOGIN_PASSWORD=validation-password docker compose --env-file .env.prod.example --env-file ops/images.apps.prod.env -f apps/pigeon/compose.yml config --quiet
      - name: Validate Caddyfile
        run: |
          for node in leader worker-1 worker-2; do
            STACK_ENV_FILE=.env.prod.example STACK_NODE_CONFIG_FILE="config/cluster/nodes/$node.env" STACK_IMAGE_ENV_FILE=ops/images.apps.prod.env STACK_FOUNDATION_IMAGE_ENV_FILE=ops/images.foundation.prod.env STACK_RUNTIME_ROOT="$PWD/.runtime/$node" ./stack.sh prod validate
          done
      - name: Validate deployment runner Dockerfile
        run: >-
          docker build --check --build-arg APK_LOCK_SHA256_AMD64=04dc754bdbbfdc2a9130ff5e13ed9213e8bb6e80f37abd033766de59a3a6e67b --build-arg APK_LOCK_SHA256_ARM64=04dc754bdbbfdc2a9130ff5e13ed9213e8bb6e80f37abd033766de59a3a6e67b ops/deploy-runner
      - name: Lint Woodpecker workflow
        run: >-
          docker run --rm -v "$PWD:/work:ro" -w /work woodpeckerci/woodpecker-cli:v3.17.0@sha256:c9710c0ed05d1ac57124cde5c7743166a9449892fc8a6adcc818976f63468d32 lint .woodpecker

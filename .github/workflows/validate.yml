name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check shell syntax
        run: bash -n stack.sh ops/*.sh ops/tests/*.sh

      - name: Lint shell scripts
        run: shellcheck stack.sh ops/*.sh ops/tests/*.sh

      - name: Run deployment controller tests
        run: ops/tests/controller-test.sh

      - name: Run platform controller tests
        run: ops/tests/platformctl-test.sh

      - name: Run stack and backup tests
        run: |
          ops/tests/stack-test.sh
          ops/tests/backup-test.sh

      - name: Validate Compose model
        run: |
          docker compose --env-file .env.prod.example --env-file ops/images.foundation.prod.env -f compose/foundation/caddy.yml config --quiet
          docker compose --env-file .env.prod.example --env-file ops/foundation/woodpecker.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/woodpecker.yml config --quiet
          docker compose --env-file .env.prod.example --env-file ops/foundation/beszel.env.example --env-file ops/images.foundation.prod.env -f compose/foundation/beszel.yml config --quiet
          docker compose --env-file .env.prod.example --env-file ops/images.apps.prod.env -f apps/newapi/compose.yml config --quiet
          docker compose --env-file .env.prod.example --env-file ops/images.apps.prod.env -f apps/cliproxyapi/compose.yml config --quiet

      - name: Validate Caddyfile
        run: STACK_ENV_FILE=.env.prod.example STACK_IMAGE_ENV_FILE=ops/images.apps.prod.env STACK_FOUNDATION_IMAGE_ENV_FILE=ops/images.foundation.prod.env STACK_RUNTIME_ROOT="$PWD/.runtime/ci" ./stack.sh prod validate

      - name: Lint Woodpecker workflow
        run: >-
          docker run --rm
          -v "$PWD:/work:ro"
          -w /work
          woodpeckerci/woodpecker-cli:v3.17.0@sha256:c9710c0ed05d1ac57124cde5c7743166a9449892fc8a6adcc818976f63468d32
          lint .woodpecker

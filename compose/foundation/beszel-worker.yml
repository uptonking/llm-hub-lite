name: foundation-beszel-worker
services:
  beszel-socket-proxy:
    image: ${BESZEL_SOCKET_PROXY_IMAGE:?BESZEL_SOCKET_PROXY_IMAGE must be digest-pinned}
    restart: unless-stopped
    mem_limit: ${BESZEL_SOCKET_PROXY_MEMORY_LIMIT:-32m}
    cpus: ${BESZEL_SOCKET_PROXY_CPUS:-0.10}
    pids_limit: ${BESZEL_SOCKET_PROXY_PIDS_LIMIT:-64}
    read_only: true
    security_opt: ['no-new-privileges:true']
    environment:
      CONTAINERS: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${BESZEL_SOCKET_PROXY_PORT:-2375}:2375"
    tmpfs: [/run, /tmp]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: beszel
      com.aichorage.component: foundation-beszel-worker
      com.aichorage.observer.ignore-logs: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  beszel-agent:
    image: ${BESZEL_AGENT_IMAGE:?BESZEL_AGENT_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${BESZEL_AGENT_MEMORY_LIMIT:-64m}
    cpus: ${BESZEL_AGENT_CPUS:-0.25}
    pids_limit: ${BESZEL_AGENT_PIDS_LIMIT:-128}
    security_opt:
      - no-new-privileges:true
      - apparmor:${BESZEL_AGENT_APPARMOR:-unconfined}
    depends_on:
      beszel-socket-proxy:
        condition: service_healthy
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: beszel
      com.aichorage.component: foundation-beszel-worker
    network_mode: host
    environment:
      LISTEN: 127.0.0.1:45876
      DISABLE_SSH: "true"
      HUB_URL: ${BESZEL_HUB_URL:?BESZEL_HUB_URL must be set}
      KEY_FILE: /run/secrets/beszel_key
      TOKEN_FILE: /run/secrets/beszel_token
      DATA_DIR: /var/lib/beszel-agent
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:?BESZEL_SYSTEM_NAME must be set}
      DOCKER_HOST: tcp://127.0.0.1:${BESZEL_SOCKET_PROXY_PORT:-2375}
      SKIP_SYSTEMD: "false"
      SERVICE_PATTERNS: ${BESZEL_SERVICE_PATTERNS:-platform-*,docker.service,containerd.service,ssh.service}
    volumes:
      - ${BESZEL_AGENT_DATA_ROOT:-/opt/platform/beszel/agent}:/var/lib/beszel-agent
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - ${BESZEL_SYSTEMD_PRIVATE_SOCKET:-/run/systemd/private}:/run/systemd/private:ro
      - ${BESZEL_KEY_FILE:?BESZEL_KEY_FILE must be set}:/run/secrets/beszel_key:ro
      - ${BESZEL_TOKEN_FILE:?BESZEL_TOKEN_FILE must be set}:/run/secrets/beszel_token:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10s

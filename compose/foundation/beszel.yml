name: foundation-beszel

services:
  beszel-hub:
    image: ${BESZEL_HUB_IMAGE:?BESZEL_HUB_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: foundation-beszel
    environment:
      APP_URL: ${BESZEL_APP_URL:?BESZEL_APP_URL must be set}
      DISABLE_PASSWORD_AUTH: ${BESZEL_DISABLE_PASSWORD_AUTH:-false}
      MFA_OTP: ${BESZEL_MFA_OTP:-false}
      USER_CREATION: ${BESZEL_USER_CREATION:-false}
      USER_EMAIL: ${BESZEL_USER_EMAIL:-}
      USER_PASSWORD: ${BESZEL_USER_PASSWORD:-}
      CHECK_UPDATES: "false"
      CONTAINER_DETAILS: ${BESZEL_CONTAINER_DETAILS:-false}
      HEARTBEAT_URL: ${BESZEL_HEARTBEAT_URL:-}
      HEARTBEAT_METHOD: ${BESZEL_HEARTBEAT_METHOD:-POST}
      HEARTBEAT_INTERVAL: ${BESZEL_HEARTBEAT_INTERVAL:-60}
    volumes:
      - ${BESZEL_DATA_ROOT:-/opt/platform/beszel/hub}:/beszel_data
    expose: ["8090"]
    networks: [platform_edge]
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10s

  beszel-socket-proxy:
    image: ${BESZEL_SOCKET_PROXY_IMAGE:?BESZEL_SOCKET_PROXY_IMAGE must be digest-pinned}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    environment:
      CONTAINERS: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${BESZEL_SOCKET_PROXY_PORT:-2375}:2375"
    tmpfs: [/run, /tmp]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: foundation-beszel

  beszel-agent:
    image: ${BESZEL_AGENT_IMAGE:?BESZEL_AGENT_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      beszel-socket-proxy:
        condition: service_started
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: foundation-beszel
    network_mode: host
    environment:
      LISTEN: 127.0.0.1:45876
      DISABLE_SSH: "true"
      HUB_URL: ${BESZEL_APP_URL:?BESZEL_APP_URL must be set}
      KEY_FILE: /run/secrets/beszel_key
      TOKEN_FILE: /run/secrets/beszel_token
      DATA_DIR: /var/lib/beszel-agent
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:-vps}
      DOCKER_HOST: tcp://127.0.0.1:${BESZEL_SOCKET_PROXY_PORT:-2375}
      SKIP_SYSTEMD: "false"
      SERVICE_PATTERNS: ${BESZEL_SERVICE_PATTERNS:-platform-*,docker.service,containerd.service,ssh.service}
    volumes:
      - ${BESZEL_AGENT_DATA_ROOT:-/opt/platform/beszel/agent}:/var/lib/beszel-agent
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - ${BESZEL_KEY_FILE:-/opt/platform/beszel/secrets/key}:/run/secrets/beszel_key:ro
      - ${BESZEL_TOKEN_FILE:-/opt/platform/beszel/secrets/token}:/run/secrets/beszel_token:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10s

networks:
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

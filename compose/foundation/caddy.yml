name: foundation-caddy
# The UDP host port is configurable so direct services can reserve UDP/443.
services:
  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${CADDY_MEMORY_LIMIT:-64m}
    cpus: ${CADDY_CPUS:-0.25}
    pids_limit: ${CADDY_PIDS_LIMIT:-128}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: caddy
      com.aichorage.component: foundation-caddy
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
    environment:
      SSL_EMAIL: ${SSL_EMAIL:?SSL_EMAIL must be set}
    volumes:
      - ${CADDY_DATA_ROOT:-/opt/platform/caddy}/data:/data
      - ${CADDY_DATA_ROOT:-/opt/platform/caddy}/config:/config
      - ${CADDY_CONFIG_ROOT:-/opt/platform/caddy/config}:/etc/caddy:ro
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:80:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0}:443:443/tcp"
      - "${CADDY_HTTPS_UDP_BIND:-0.0.0.0}:${CADDY_HTTPS_UDP_HOST_PORT:-443}:443/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - platform_edge
networks:
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

name: foundation-woodpecker-controller
services:
  woodpecker-server:
    image: ${WOODPECKER_SERVER_IMAGE:?WOODPECKER_SERVER_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    mem_limit: ${WOODPECKER_SERVER_MEMORY_LIMIT:-256m}
    cpus: ${WOODPECKER_SERVER_CPUS:-0.50}
    pids_limit: ${WOODPECKER_SERVER_PIDS_LIMIT:-256}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: foundation-woodpecker-controller
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
    expose: ["8000", "9000"]
    volumes:
      - ${WOODPECKER_DATA_ROOT:-/opt/platform/woodpecker/data}:/var/lib/woodpecker
    environment:
      WOODPECKER_OPEN: ${WOODPECKER_OPEN:-false}
      WOODPECKER_ADMIN: ${WOODPECKER_ADMIN:?WOODPECKER_ADMIN must be set}
      WOODPECKER_HOST: ${WOODPECKER_HOST:?WOODPECKER_HOST must be set}
      WOODPECKER_GITHUB: "true"
      WOODPECKER_GITHUB_CLIENT: ${WOODPECKER_GITHUB_CLIENT:?WOODPECKER_GITHUB_CLIENT must be set}
      WOODPECKER_GITHUB_SECRET: ${WOODPECKER_GITHUB_SECRET:?WOODPECKER_GITHUB_SECRET must be set}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:?WOODPECKER_AGENT_SECRET must be set}
      WOODPECKER_GRPC_SECRET: ${WOODPECKER_GRPC_SECRET:?WOODPECKER_GRPC_SECRET must be set}
      WOODPECKER_REPO_OWNERS: ${WOODPECKER_REPO_OWNERS:?WOODPECKER_REPO_OWNERS must be set}
      WOODPECKER_SERVER_ADDR: 0.0.0.0:8000
      WOODPECKER_GRPC_ADDR: 0.0.0.0:9000
      WOODPECKER_DATABASE_DRIVER: ${WOODPECKER_DATABASE_DRIVER:-sqlite3}
      WOODPECKER_DATABASE_DATASOURCE: ${WOODPECKER_DATABASE_DATASOURCE:-/var/lib/woodpecker/woodpecker.sqlite}
      WOODPECKER_DATABASE_MAX_CONNECTIONS: ${WOODPECKER_DATABASE_MAX_CONNECTIONS:-1}
      WOODPECKER_DATABASE_IDLE_CONNECTIONS: ${WOODPECKER_DATABASE_IDLE_CONNECTIONS:-1}
      WOODPECKER_FORCE_IGNORE_SERVICE_FAILURE: ${WOODPECKER_FORCE_IGNORE_SERVICE_FAILURE:-false}
      WOODPECKER_LOG_LEVEL: ${WOODPECKER_LOG_LEVEL:-info}
    networks: [woodpecker_private, platform_edge]
    healthcheck:
      test: ["CMD", "/bin/woodpecker-server", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
networks:
  woodpecker_private:
    name: foundation-woodpecker_private
    external: true
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/google/yamlfmt
    rev: v0.19.0
    hooks:
      - id: yamlfmt
        exclude: ^\.woodpecker/
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: generated-woodpecker-workflows
        name: check generated Woodpecker workflows
        entry: ops/generate-woodpecker-workflows.sh --check
        language: system
        pass_filenames: false
      - id: staged-ip-privacy
        name: check staged IP privacy
        entry: ops/check-ip-privacy.sh --cached
        language: system
        pass_filenames: false

name: app-relaichor1
services:
  relaichor1:
    image: ${RELAICHOR1_IMAGE:?RELAICHOR1_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    stop_grace_period: 30s
    mem_limit: ${RELAICHOR1_MEMORY_LIMIT:-256m}
    cpus: ${RELAICHOR1_CPUS:-0.20}
    pids_limit: ${RELAICHOR1_PIDS_LIMIT:-96}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=65532,gid=65532
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HOME: /tmp
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      RELAY_ADDR: ${RELAICHOR1_ADDR:-:8411}
      LOG_FORMAT: ${RELAICHOR1_LOG_FORMAT:-json}
    command: ["--addr", ":8411", "--max-buffer-frames", "${RELAICHOR1_MAX_BUFFER_FRAMES:-64}", "--log-format", "${RELAICHOR1_LOG_FORMAT:-json}"]
    expose: ["8411"]
    networks: [relaichor1_private, platform_edge]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: relaichor1
      com.aichorage.component: app-relaichor1
  health-probe:
    image: ${HEALTH_PROBE_IMAGE:?HEALTH_PROBE_IMAGE must be digest-pinned}
    restart: unless-stopped
    mem_limit: 16m
    cpus: 0.05
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint: ["/bin/sh"]
    command: ["-eu", "-c", "while :; do sleep 3600; done"]
    tmpfs: [/tmp]
    depends_on:
      relaichor1:
        condition: service_started
    networks: [relaichor1_private]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: relaichor1
      com.aichorage.component: app-relaichor1
      com.aichorage.observer.ignore-logs: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://relaichor1:8411/health | grep -Fq '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
networks:
  relaichor1_private:
    name: app-relaichor1_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

name: app-club
services:
  club:
    image: ${CLUB_IMAGE:?CLUB_IMAGE must be digest-pinned}
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${CLUB_MEMORY_LIMIT:-384m}
    cpus: ${CLUB_CPUS:-0.5}
    pids_limit: ${CLUB_PIDS_LIMIT:-256}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: club
      com.aichorage.component: app-club
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AUTO_INSTALL: "1"
      DB_TYPE: sqlite3
      DB_FILE: /data/sqlite3/answer.db
      LANGUAGE: en_US
      SITE_NAME: ${CLUB_SITE_NAME:-Club}
      SITE_URL: ${CLUB_SITE:-https://club.aichorage.de}
      CONTACT_EMAIL: ${CLUB_ADMIN_EMAIL:-admin@aichorage.de}
      ADMIN_NAME: ${CLUB_ADMIN_USER:-clubadmin}
      ADMIN_PASSWORD: ${CLUB_ADMIN_PASSWORD:?CLUB_ADMIN_PASSWORD must be set}
      ADMIN_EMAIL: ${CLUB_ADMIN_EMAIL:-admin@aichorage.de}
      EXTERNAL_CONTENT_DISPLAY: ask_before_display
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/club:/data
      - ./entrypoint.sh:/entrypoint.sh:ro
    networks:
      club_private:
        aliases:
          - club
      platform_edge:
        aliases:
          - club
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:80/answer/api/v1/siteinfo | grep -Fq '\"version\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
networks:
  club_private:
    name: app-club_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

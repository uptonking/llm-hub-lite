name: app-searx
services:
  searx:
    image: ${SEARX_IMAGE:?SEARX_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${SEARX_MEMORY_LIMIT:-900m}
    cpus: ${SEARX_CPUS:-0.80}
    pids_limit: ${SEARX_PIDS_LIMIT:-128}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: searx
      com.aichorage.component: app-searx
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SEARXNG_PORT: ${SEARX_PORT:-8080}
      SEARXNG_BIND_ADDRESS: ${SEARX_BIND_ADDRESS:-0.0.0.0}
      SEARXNG_BASE_URL: ${SEARX_BASE_URL:-${SEARX_SITE:?SEARX_SITE must be set}}
      SEARXNG_SECRET: ${SEARX_SECRET:?SEARX_SECRET must be set}
      SEARXNG_LIMITER: ${SEARX_LIMITER:-false}
      SEARXNG_PUBLIC_INSTANCE: ${SEARX_PUBLIC_INSTANCE:-false}
      SEARXNG_IMAGE_PROXY: ${SEARX_IMAGE_PROXY:-false}
      SEARXNG_METHOD: ${SEARX_METHOD:-GET}
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/searx/config:/etc/searxng
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/searx/cache:/var/cache/searxng
    networks: [searx_private, platform_edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5); raise SystemExit(0 if r.status == 200 and r.read().strip() == b'OK' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
networks:
  searx_private:
    name: app-searx_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

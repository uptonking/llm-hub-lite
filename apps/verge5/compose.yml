name: app-verge5
services:
  verge5:
    image: ${VERGE5_IMAGE:?VERGE5_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /run:size=16m,noexec,nosuid
    mem_limit: ${VERGE5_MEMORY_LIMIT:-512m}
    cpus: ${VERGE5_CPUS:-1.0}
    pids_limit: ${VERGE5_PIDS_LIMIT:-64}
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    security_opt: ['no-new-privileges:true']
    network_mode: host
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: verge5
      com.aichorage.component: app-verge5
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    environment:
      HYSTERIA_ACME_DIR: /var/lib/hysteria/acme
      HYSTERIA_DISABLE_UPDATE_CHECK: "true"
      HYSTERIA_LOG_LEVEL: ${VERGE5_LOG_LEVEL:-warn}
      GOMAXPROCS: ${VERGE5_GOMAXPROCS:-2}
      GOMEMLIMIT: ${VERGE5_GOMEMLIMIT:-450MiB}
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/verge5:/var/lib/hysteria
      - ${RUNTIME_CONFIG_FILE:-/etc/llm-hub-lite/runtime/verge5/config.yaml}:/etc/hysteria/config.yaml:ro
    command: ["server", "-c", "/etc/hysteria/config.yaml"]

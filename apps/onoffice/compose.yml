# OnlyOffice DocumentServer, published at https://onoffice.aichorage.de on worker-1.
#
# This host is NOT unused. Filer (worker-2) previews and edits documents here: it
# sets ONOFFICE_SITE=https://onoffice.aichorage.de and shares
# FILEBROWSER_ONLYOFFICE_SECRET with this container's JWT_SECRET. The editor flow is
# therefore:
#
#   browser -> filer.aichorage.de -> onoffice.aichorage.de -> filer (document bytes)
#
# The last hop leaves worker-2 and comes back through Cloudflare, so any edge rate
# limit that throttles cluster node addresses will break document editing.
#
# Accepted risks, tolerable only because the edge blocks scanner and probe traffic
# (see docs/edge-protection.md):
#   - USE_UNAUTHORIZED_STORAGE=true: the editor path needs no auth, so anyone who can
#     reach it can ask it to load a document from a URL they choose.
#   - ALLOW_PRIVATE_IP_ADDRESS=true: SSRF-adjacent; this container has no
#     EGRESS_PROFILE, so it can reach the private network.
# Revisit both if onoffice ever serves users outside the filer workflow.
name: app-onoffice
services:
  onoffice:
    image: ${ONOFFICE_IMAGE:?ONOFFICE_IMAGE must be digest-pinned}
    entrypoint: ["/bin/bash", "/app/ds/entrypoint.sh"]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${ONOFFICE_MEMORY_LIMIT:-3072m}
    cpus: ${ONOFFICE_CPUS:-2.5}
    pids_limit: ${ONOFFICE_PIDS_LIMIT:-1024}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: onoffice
      com.aichorage.component: app-onoffice
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WOPI_ENABLED: "true"
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONOFFICE_JWT_SECRET:?ONOFFICE_JWT_SECRET must be set}
      JWT_HEADER: "Authorization"
      JWT_IN_BODY: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
      GENERATE_FONTS: "true"
      EXAMPLE_ENABLED: "true"
      ADMINPANEL_ENABLED: "true"
      METRICS_ENABLED: "false"
      NGINX_WORKER_PROCESSES: "2"
      DS_LOG_LEVEL: "WARN"
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/onoffice/data:/var/www/onlyoffice/Data
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/onoffice/lib:/var/lib/onlyoffice
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/onoffice/postgresql:/var/lib/postgresql
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/onoffice/rabbitmq:/var/lib/rabbitmq
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/onoffice/redis:/var/lib/redis
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/onoffice/example:/var/www/onlyoffice/documentserver-example/public/files
      - ./entrypoint.sh:/app/ds/entrypoint.sh:ro
    networks:
      platform_edge:
        aliases: [onoffice]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:80/healthcheck | grep -Fq 'true'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s
networks:
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

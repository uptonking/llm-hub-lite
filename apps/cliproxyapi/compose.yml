name: app-cliproxyapi

services:
  cliproxyapi:
    image: ${CLIPROXY_IMAGE:?CLIPROXY_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: app-cliproxyapi
    environment:
      MANAGEMENT_PASSWORD: ${CLIPROXY_MANAGEMENT_KEY:?CLIPROXY_MANAGEMENT_KEY must be set}
      TZ: ${TZ:-Asia/Shanghai}
    working_dir: /CLIProxyAPI
    command:
      - sh
      - -c
      - >-
        mkdir -p /runtime/auths /runtime/logs /runtime/plugins;
        if [ ! -f /runtime/config.yaml ]; then cp /run/configs/cliproxy_config_seed /runtime/config.yaml; fi;
        exec ./CLIProxyAPI --config /runtime/config.yaml
    configs:
      - source: cliproxy_config_seed
        target: /run/configs/cliproxy_config_seed
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/cliproxy:/runtime
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/cliproxy/logs:/CLIProxyAPI/logs
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/cliproxy/plugins:/CLIProxyAPI/plugins
    networks: [cliproxyapi_private, platform_edge]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

configs:
  cliproxy_config_seed:
    content: |
      host: ""
      port: 8317
      auth-dir: "/runtime/auths"
      api-keys:
        - "${CLIPROXY_API_KEY:?CLIPROXY_API_KEY must be set}"
      debug: false
      remote-management:
        allow-remote: true
        secret-key: "${CLIPROXY_MANAGEMENT_KEY:?CLIPROXY_MANAGEMENT_KEY must be set}"
        disable-control-panel: false
      logging-to-file: true
      logs-max-total-size-mb: 100
      error-logs-max-files: 10

networks:
  cliproxyapi_private:
    name: app-cliproxyapi_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

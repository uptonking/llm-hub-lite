name: app-wobase
services:
  wobase:
    image: ${WOBASE_IMAGE:?WOBASE_IMAGE must be digest-pinned}
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${WOBASE_MEMORY_LIMIT:-1500m}
    cpus: ${WOBASE_CPUS:-0.9}
    pids_limit: ${WOBASE_PIDS_LIMIT:-256}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: wobase
      com.aichorage.component: app-wobase
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GRIST_SESSION_SECRET: ${WOBASE_SESSION_SECRET:?WOBASE_SESSION_SECRET must be set}
      GRIST_BOOT_KEY: ${WOBASE_BOOT_KEY:?WOBASE_BOOT_KEY must be set}
      GRIST_IN_SERVICE: ${WOBASE_IN_SERVICE:-false}
      GRIST_DATA_DIR: /persist/docs
      GRIST_INST_DIR: /persist
      TYPEORM_DATABASE: /persist/home.sqlite3
      GRIST_SQLITE_MODE: ${WOBASE_SQLITE_MODE:-wal}
      DOC_WORKER_COUNT: ${WOBASE_DOC_WORKER_COUNT:-1}
      GRIST_LOG_LEVEL: ${WOBASE_LOG_LEVEL:-warn}
      GRIST_TELEMETRY_LEVEL: ${WOBASE_TELEMETRY_LEVEL:-off}
      GRIST_ALLOW_AUTOMATIC_VERSION_CHECKING: ${WOBASE_ALLOW_AUTOMATIC_VERSION_CHECKING:-false}
      GRIST_LOG_HTTP: ${WOBASE_LOG_HTTP:-false}
      GRIST_LOG_API_DETAILS: ${WOBASE_LOG_API_DETAILS:-false}
      GRIST_MAX_PARALLEL_REQUESTS_PER_DOC: ${WOBASE_MAX_PARALLEL_REQUESTS_PER_DOC:-2}
      GRIST_MAX_UPLOAD_IMPORT_MB: ${WOBASE_MAX_UPLOAD_IMPORT_MB:-32}
      GRIST_MAX_UPLOAD_ATTACHMENT_MB: ${WOBASE_MAX_UPLOAD_ATTACHMENT_MB:-32}
      NODE_OPTIONS: ${WOBASE_NODE_OPTIONS:---no-deprecation --max-old-space-size=768}
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/wobase:/persist
    networks: [wobase_private, platform_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 'http://127.0.0.1:8484/status?ready=1&db=1' | grep -Fq 'is alive'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
networks:
  wobase_private:
    name: app-wobase_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

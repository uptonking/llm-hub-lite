name: app-filer
services:
  filer:
    image: ${FILER_IMAGE:?FILER_IMAGE must be digest-pinned}
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${FILER_MEMORY_LIMIT:-256m}
    cpus: ${FILER_CPUS:-0.5}
    pids_limit: ${FILER_PIDS_LIMIT:-128}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: filer
      com.aichorage.component: app-filer
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      FILER_ADMIN_PASSWORD: ${FILER_ADMIN_PASSWORD:?FILER_ADMIN_PASSWORD must be set}
      FILEBROWSER_ADMIN_PASSWORD: ${FILER_ADMIN_PASSWORD:?FILER_ADMIN_PASSWORD must be set}
      FILEBROWSER_CONFIG: /home/filebrowser/config/config.yaml
      FILEBROWSER_DATABASE_PATH: /home/filebrowser/data/database.sqlite
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/filer/data:/home/filebrowser/data
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/filer/storage/shared:/srv/shared
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/filer/storage/personal:/srv/personal
      - ./config.yaml:/home/filebrowser/config/config.yaml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    networks:
      filer_private:
      platform_edge:
        aliases: [filer]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:80/health | grep -Fq '\"message\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
networks:
  filer_private:
    name: app-filer_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

name: app-verge-relay
services:
  verge-relay:
    image: ${VERGE_RELAY_IMAGE:?VERGE_RELAY_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
      - /root:size=8m,noexec,nosuid
    mem_limit: ${VERGE_RELAY_MEMORY_LIMIT:-64m}
    cpus: ${VERGE_RELAY_CPUS:-0.25}
    pids_limit: ${VERGE_RELAY_PIDS_LIMIT:-64}
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: verge-relay
      com.aichorage.component: app-verge-relay
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    command: ["-L", "udp://:2053/${VERGE_RELAY_TARGET:?VERGE_RELAY_TARGET must be set}"]
    ports:
      - "0.0.0.0:2053:2053/udp"

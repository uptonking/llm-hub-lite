name: app-openclouds
services:
  openclouds:
    image: ${OPENCLOUDS_IMAGE:?OPENCLOUDS_IMAGE must be digest-pinned}
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${OPENCLOUDS_MEMORY_LIMIT:-768m}
    cpus: ${OPENCLOUDS_CPUS:-0.75}
    pids_limit: ${OPENCLOUDS_PIDS_LIMIT:-256}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: openclouds
      com.aichorage.component: app-openclouds
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OC_URL: ${OPENCLOUDS_SITE:-https://openclouds.aichorage.de}
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      PROXY_DEBUG_ADDR: "0.0.0.0:9205"
      PROXY_TLS: "false"
      OC_INSECURE: "false"
      OC_LOG_LEVEL: "info"
      PROXY_ENABLE_BASIC_AUTH: "false"
      IDM_CREATE_DEMO_USERS: "false"
      IDM_ADMIN_PASSWORD: ${OPENCLOUDS_ADMIN_PASSWORD:?OPENCLOUDS_ADMIN_PASSWORD must be set}
      # Storage Backend (PosixFS)
      STORAGE_USERS_DRIVER: "posix"
      STORAGE_USERS_POSIX_ROOT: "/var/lib/opencloud/storage/users"
      STORAGE_USERS_ID_CACHE_STORE: "nats-js-kv"
      STORAGE_USERS_POSIX_SCAN_FS: "true"
      STORAGE_USERS_POSIX_WATCH_FS: "false"
      # External OIDC with Auther (Authelia)
      OC_EXCLUDE_RUN_SERVICES: "idp,search,activitylog,userlog,thumbnails,ocm"
      OC_ADD_RUN_SERVICES: "collaboration"
      # WOPI Collabora integration
      FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR: "eu.opencloud.api.collaboration"
      GRAPH_AVAILABLE_ROLES: "b1e2218d-eef8-4d4c-b82d-0f1a1b48f3b5,a8d5fe5e-96e3-418d-825b-534dbdf22b99,fb6c3e19-e378-47e5-b277-9732f9de6e21,58c63c02-1d89-4572-916a-870abc5a1b7d,2d00ce52-1fc2-4dbc-8b95-a73b73395f5a,1c996275-f1c9-4e71-abdf-a42f6495e960,312c0871-5ef7-4b3a-85b6-0e4074c64049,aa97fe03-7980-45ac-9e50-b325749fd7e6"
      COLLABORATION_WOPI_SRC: ${OPENCLOUDS_SITE:-https://openclouds.aichorage.de}
      COLLABORATION_APP_NAME: "CollaboraOnline"
      COLLABORATION_APP_PRODUCT: "Collabora"
      COLLABORATION_APP_ADDR: ${COLLABORA_SITE:-https://collabora.aichorage.de}
      COLLABORATION_APP_DESCRIPTION: "Collabora Online"
      COLLABORATION_APP_INSECURE: "false"
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "false"
      COLLABORATION_APP_PROOF_DISABLE: "true"
      OC_OIDC_ISSUER: "https://auther.aichorage.de"
      IDP_DOMAIN: "auther.aichorage.de"
      OC_OIDC_CLIENT_ID: "openclouds"
      WEB_OIDC_CLIENT_ID: "openclouds"
      WEB_OIDC_SCOPE: "openid profile email groups"
      OC_OIDC_CLIENT_SCOPES: "openid profile email groups"
      WEBFINGER_WEB_OIDC_CLIENT_ID: "openclouds"
      WEBFINGER_WEB_OIDC_CLIENT_SCOPES: "openid profile email groups"
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: "none"
      PROXY_OIDC_SKIP_VERIFICATION: "false"
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_USER_OIDC_CLAIM: "preferred_username"
      PROXY_AUTOPROVISION_CLAIM_USERNAME: "preferred_username"
      PROXY_USER_CS3_CLAIM: "username"
      PROXY_ROLE_ASSIGNMENT_DRIVER: "default"
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "true"
      GRAPH_USERNAME_MATCH: "none"
      # Optimizations for minimal single-node footprint
      FRONTEND_CHECK_FOR_UPDATES: "false"
      GOMEMLIMIT: "512MiB"
      GOGC: "80"
      OC_MAX_CONCURRENCY: "2"
      STORAGE_USERS_EVENTS_NUM_CONSUMERS: "1"
      PROXY_CSP_CONFIG_FILE_LOCATION: "/etc/opencloud/csp.yaml"
      OPENCLOUDS_DEFAULT_QUOTA_BYTES: ${OPENCLOUDS_DEFAULT_QUOTA_BYTES:-5368709120}
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/openclouds/config:/etc/opencloud
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/openclouds/data:/var/lib/opencloud
      - ./csp.yaml:/etc/opencloud-template/csp.yaml:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    networks:
      openclouds_private:
      platform_edge:
        aliases: [openclouds]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:9205/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  openclouds_private:
    name: app-openclouds_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

name: app-wapdf
services:
  wapdf:
    image: ${WAPDF_IMAGE:?WAPDF_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    mem_limit: ${WAPDF_MEMORY_LIMIT:-900m}
    cpus: ${WAPDF_CPUS:-0.60}
    pids_limit: ${WAPDF_PIDS_LIMIT:-64}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      # BentoPDF's nginx-unprivileged image runs as uid/gid 101. Mount each
      # pre-existing Nginx runtime directory rather than replacing its cache
      # root, which would omit the required temp subdirectories.
      - /etc/nginx/tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700
      - /var/cache/nginx/client_temp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0700
      - /var/cache/nginx/proxy_temp:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0700
      - /var/cache/nginx/fastcgi_temp:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0700
      - /var/cache/nginx/uwsgi_temp:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0700
      - /var/cache/nginx/scgi_temp:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0700
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: wapdf
      com.aichorage.component: app-wapdf
    networks: [wapdf_private, platform_edge]
  health-probe:
    image: ${HEALTH_PROBE_IMAGE:?HEALTH_PROBE_IMAGE must be digest-pinned}
    restart: unless-stopped
    mem_limit: 16m
    cpus: 0.05
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint: ["/bin/sh"]
    command: ["-eu", "-c", "while :; do sleep 3600; done"]
    tmpfs: [/tmp]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: wapdf
      com.aichorage.component: app-wapdf
      com.aichorage.observer.ignore-logs: "true"
    depends_on:
      wapdf:
        condition: service_started
    networks: [wapdf_private]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://wapdf:8080/ | grep -Fq 'BentoPDF - Free Online PDF Tools'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  wapdf_private:
    name: app-wapdf_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

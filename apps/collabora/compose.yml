name: app-collabora
services:
  collabora:
    image: ${COLLABORA_IMAGE:?COLLABORA_IMAGE must be digest-pinned}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${COLLABORA_MEMORY_LIMIT:-1280m}
    cpus: ${COLLABORA_CPUS:-1.0}
    pids_limit: ${COLLABORA_PIDS_LIMIT:-256}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: collabora
      com.aichorage.component: app-collabora
    cap_add:
      - SYS_ADMIN
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      server_name: collabora.aichorage.de
      aliasgroup1: https://openclouds.aichorage.de,https://openclouds.aichorage.de:443
      username: ${COLLABORA_ADMIN_USER:-admin}
      password: ${COLLABORA_ADMIN_PASSWORD:?COLLABORA_ADMIN_PASSWORD must be set}
      content_security_policy: "frame-ancestors 'self' https://openclouds.aichorage.de https://collabora.aichorage.de openclouds.aichorage.de collabora.aichorage.de;"
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=true --o:welcome.enable=false --o:net.lok_allow.host[6]=openclouds.aichorage.de --o:net.lok_allow.host[7]=openclouds.aichorage.de:443 --o:ai.enabled=true --o:ai.allow_user_settings=true --o:ai.allowed_hosts.host[4]=aichorouter.aichorage.de --o:per_document.max_concurrency=2 --o:per_document.idle_timeout_secs=1800 --o:languagetool.enabled=false --o:languagetool.allow_user_settings=false --o:deepl.enabled=false --o:grammalecte.enabled=false --o:grammalecte.allow_user_settings=false --o:duden.enabled=false --o:duden.allow_user_settings=false --o:num_prespawn_children=1 --o:fetch_update_check=0 --o:allow_update_popup=false
    networks:
      platform_edge:
        aliases: [collabora]
    healthcheck:
      test: ["CMD", "/usr/bin/coolwsd", "--probe", "--use-env-vars"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

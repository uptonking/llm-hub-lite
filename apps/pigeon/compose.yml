name: app-pigeon
services:
  pigeon:
    image: ${PIGEON_IMAGE:?PIGEON_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    mem_limit: ${PIGEON_MEMORY_LIMIT:-512m}
    cpus: ${PIGEON_CPUS:-0.50}
    pids_limit: ${PIGEON_PIDS_LIMIT:-128}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /root/.gunicorn:rw,noexec,nosuid,size=1m
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: app-pigeon
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SECRET_KEY: ${PIGEON_SECRET_KEY:?PIGEON_SECRET_KEY must be set}
      LOGIN_PASSWORD: ${PIGEON_LOGIN_PASSWORD:?PIGEON_LOGIN_PASSWORD must be set}
      DATABASE_PATH: /data/outlook_accounts.db
      DOCKER_UPDATE_ENABLED: "false"
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_ENV: production
      LOG_LEVEL: ${PIGEON_LOG_LEVEL:-WARNING}
      GUNICORN_THREADS: ${PIGEON_GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${PIGEON_GUNICORN_TIMEOUT:-300}
      HTTP_REQUEST_TIMEOUT: ${PIGEON_HTTP_REQUEST_TIMEOUT:-30}
      IMAP_TIMEOUT: ${PIGEON_IMAP_TIMEOUT:-45}
      MAIL_FETCH_OVERALL_TIMEOUT: ${PIGEON_MAIL_FETCH_OVERALL_TIMEOUT:-120}
      OAUTH_CLIENT_ID: ${PIGEON_OAUTH_CLIENT_ID:-9e5f94bc-e8a4-4e73-b8be-63364c29d753}
      OAUTH_REDIRECT_URI: ${PIGEON_OAUTH_REDIRECT_URI:-http://localhost:8080}
      GPTMAIL_BASE_URL: ${PIGEON_GPTMAIL_BASE_URL:-https://mail.chatgpt.org.uk}
      GPTMAIL_API_KEY: ${PIGEON_GPTMAIL_API_KEY:-gpt-test}
      DUCKMAIL_BASE_URL: ${PIGEON_DUCKMAIL_BASE_URL:-https://api.duckmail.sbs}
      DUCKMAIL_API_KEY: ${PIGEON_DUCKMAIL_API_KEY:-}
      CLOUDFLARE_WORKER_DOMAIN: ${PIGEON_CLOUDFLARE_WORKER_DOMAIN:-}
      CLOUDFLARE_EMAIL_DOMAINS: ${PIGEON_CLOUDFLARE_EMAIL_DOMAINS:-}
      CLOUDFLARE_ADMIN_PASSWORD: ${PIGEON_CLOUDFLARE_ADMIN_PASSWORD:-}
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/pigeon:/data
    networks: [pigeon_private, platform_edge]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/login >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  health-probe:
    image: ${HEALTH_PROBE_IMAGE:?HEALTH_PROBE_IMAGE must be digest-pinned}
    restart: unless-stopped
    mem_limit: 16m
    cpus: 0.05
    pids_limit: 32
    read_only: true
    security_opt: ['no-new-privileges:true']
    entrypoint: ["/bin/sh"]
    command: ["-eu", "-c", "while :; do sleep 3600; done"]
    tmpfs: [/tmp]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: app-pigeon
      com.aichorage.observer.ignore-logs: "true"
    depends_on:
      pigeon:
        condition: service_started
    networks: [pigeon_private]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://pigeon:5000/login >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
networks:
  pigeon_private:
    name: app-pigeon_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

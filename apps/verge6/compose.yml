name: app-verge6
services:
  verge6:
    image: ${VERGE6_IMAGE:?VERGE6_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: ${VERGE6_MEMORY_LIMIT:-512m}
    cpus: ${VERGE6_CPUS:-0.5}
    pids_limit: ${VERGE6_PIDS_LIMIT:-64}
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN
    security_opt: ['no-new-privileges:true']
    network_mode: host
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: verge6
      com.aichorage.component: app-verge6
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    environment:
      HYSTERIA_ACME_DIR: /var/lib/hysteria/acme
      HYSTERIA_DISABLE_UPDATE_CHECK: "true"
      HYSTERIA_LOG_LEVEL: ${VERGE6_LOG_LEVEL:-warn}
      GOMAXPROCS: ${VERGE6_GOMAXPROCS:-1}
      GOMEMLIMIT: ${VERGE6_GOMEMLIMIT:-450MiB}
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/verge6:/var/lib/hysteria
      - ${RUNTIME_CONFIG_FILE:-/etc/llm-hub-lite/runtime/verge6/config.yaml}:/etc/hysteria/config.yaml:ro
    command: ["server", "-c", "/etc/hysteria/config.yaml"]

name: app-aichor1
services:
  aichor1:
    image: ${AICHOR_IMAGE:?AICHOR_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${AICHOR1_MEMORY_LIMIT:-900m}
    cpus: ${AICHOR1_CPUS:-0.80}
    pids_limit: ${AICHOR1_PIDS_LIMIT:-384}
    entrypoint: ["/aichor1-entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PASEO_HOME: /home/paseo/.paseo
      PASEO_LISTEN: 0.0.0.0:6767
      PASEO_PASSWORD: ${AICHOR1_PASSWORD:?AICHOR1_PASSWORD must be set}
      GH_TOKEN: ${GH_TOKEN:-}
      PASEO_HOSTNAMES: ${AICHOR1_HOSTNAMES:-.aichorage.de}
      PASEO_WEB_UI_ENABLED: "true"
      PASEO_LOG_LEVEL: ${AICHOR1_LOG_LEVEL:-warn}
      PASEO_LOG_FORMAT: ${AICHOR1_LOG_FORMAT:-json}
      PASEO_TRUSTED_PROXIES: ${AICHOR1_TRUSTED_PROXIES:-loopback,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      PASEO_CORS_ORIGINS: ${AICHOR1_CORS_ORIGINS:-${AICHOR1_SITE:?AICHOR1_SITE must be set}}
      AICHOR1_PI_OPENAI_ENABLED: ${AICHOR1_PI_OPENAI_ENABLED:-false}
      AICHOR1_PI_OPENAI_API_KEY: ${AICHOR1_PI_OPENAI_API_KEY:-}
      AICHOR1_PI_ANTHROPIC_ENABLED: ${AICHOR1_PI_ANTHROPIC_ENABLED:-false}
      AICHOR1_PI_ANTHROPIC_API_KEY: ${AICHOR1_PI_ANTHROPIC_API_KEY:-}
      AICHOR1_PI_OPENROUTER_ENABLED: ${AICHOR1_PI_OPENROUTER_ENABLED:-false}
      AICHOR1_PI_OPENROUTER_API_KEY: ${AICHOR1_PI_OPENROUTER_API_KEY:-}
      # Optional relay overrides are translated by entrypoint-common.sh only
      # when non-empty, preserving Paseo's persisted/default relay settings.
      AICHOR1_RELAY_ENABLED: ${AICHOR1_RELAY_ENABLED:-}
      AICHOR1_RELAY_ENDPOINT: ${AICHOR1_RELAY_ENDPOINT:-}
      AICHOR1_RELAY_PUBLIC_ENDPOINT: ${AICHOR1_RELAY_PUBLIC_ENDPOINT:-}
      AICHOR1_RELAY_USE_TLS: ${AICHOR1_RELAY_USE_TLS:-}
      AICHOR1_RELAY_PUBLIC_USE_TLS: ${AICHOR1_RELAY_PUBLIC_USE_TLS:-}
    volumes:
      - ./entrypoint.sh:/aichor1-entrypoint.sh:ro
      - ../paseo/entrypoint-common.sh:/paseo-entrypoint-common.sh:ro
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/aichor1:/home/paseo
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/aichor1/workspace:/workspace
    networks: [aichor1_private, platform_edge]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:6767/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: aichor1
      com.aichorage.component: app-aichor1
networks:
  aichor1_private:
    name: app-aichor1_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

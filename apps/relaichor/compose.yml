name: app-relaichor
services:
  relaichor:
    image: ${RELAICHOR_IMAGE:?RELAICHOR_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${RELAICHOR_MEMORY_LIMIT:-512m}
    cpus: ${RELAICHOR_CPUS:-0.35}
    pids_limit: ${RELAICHOR_PIDS_LIMIT:-128}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777,uid=65532,gid=65532
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HOME: /tmp
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ELIXIR_ERL_OPTIONS: +fnu
      PASEO_RELAY_HOST: 0.0.0.0
      PASEO_RELAY_PORT: ${RELAICHOR_PORT:-4000}
      PASEO_RELAY_ACCEPTORS: ${RELAICHOR_ACCEPTORS:-2}
      PASEO_RELAY_CONNECTIONS_PER_ACCEPTOR: ${RELAICHOR_CONNECTIONS_PER_ACCEPTOR:-128}
      PASEO_RELAY_HTTP_IDLE_TIMEOUT_MS: ${RELAICHOR_HTTP_IDLE_TIMEOUT_MS:-15000}
      PASEO_RELAY_CAPACITY_MUTATION_TIMEOUT_MS: ${RELAICHOR_CAPACITY_MUTATION_TIMEOUT_MS:-5000}
      PASEO_RELAY_INGRESS_BUDGET_BYTES: ${RELAICHOR_INGRESS_BUDGET_BYTES:-134217728}
      PASEO_RELAY_INGRESS_WEIGHT: ${RELAICHOR_INGRESS_WEIGHT:-4}
      PASEO_RELAY_DELIVERY_TIMEOUT_MS: ${RELAICHOR_DELIVERY_TIMEOUT_MS:-30000}
      PASEO_RELAY_TRANSPORT_SEND_TIMEOUT_MS: ${RELAICHOR_TRANSPORT_SEND_TIMEOUT_MS:-35000}
      PASEO_RELAY_CONTROL_QUEUE_BYTES: ${RELAICHOR_CONTROL_QUEUE_BYTES:-1048576}
      PASEO_RELAY_DATA_ATTACH_TIMEOUT_MS: ${RELAICHOR_DATA_ATTACH_TIMEOUT_MS:-15000}
      PASEO_RELAY_TCP_RECEIVE_BUFFER_BYTES: ${RELAICHOR_TCP_RECEIVE_BUFFER_BYTES:-65536}
      PASEO_RELAY_MEMORY_WATERMARK_BYTES: ${RELAICHOR_MEMORY_WATERMARK_BYTES:-400000000}
      PASEO_RELAY_MIN_CLUSTER_SIZE: ${RELAICHOR_MIN_CLUSTER_SIZE:-1}
      PASEO_RELAY_OWNERSHIP_TARGET: ${RELAICHOR_OWNERSHIP_TARGET:-local}
      PASEO_RELAY_REROUTE_HEADER: ${RELAICHOR_REROUTE_HEADER:-x-reroute-target}
    expose: ["4000"]
    networks: [relaichor_private, platform_edge]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: relaichor
      com.aichorage.component: app-relaichor
  health-probe:
    image: ${HEALTH_PROBE_IMAGE:?HEALTH_PROBE_IMAGE must be digest-pinned}
    restart: unless-stopped
    mem_limit: 16m
    cpus: 0.05
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint: ["/bin/sh"]
    command: ["-eu", "-c", "while :; do sleep 3600; done"]
    tmpfs: [/tmp]
    depends_on:
      relaichor:
        condition: service_started
    networks: [relaichor_private]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.application: relaichor
      com.aichorage.component: app-relaichor
      com.aichorage.observer.ignore-logs: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://relaichor:4000/ready | grep -Fq '\"status\":\"ready\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
networks:
  relaichor_private:
    name: app-relaichor_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

name: app-observer
services:
  observer:
    image: ${OBSERVER_IMAGE:?OBSERVER_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    mem_limit: ${OBSERVER_MEMORY_LIMIT:-512m}
    cpus: ${OBSERVER_CPUS:-0.50}
    pids_limit: ${OBSERVER_PIDS_LIMIT:-256}
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: app-observer
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ZO_ROOT_USER_EMAIL: ${OBSERVER_ROOT_USER_EMAIL:?OBSERVER_ROOT_USER_EMAIL must be set}
      ZO_ROOT_USER_PASSWORD: ${OBSERVER_ROOT_USER_PASSWORD:?OBSERVER_ROOT_USER_PASSWORD must be set}
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_DATA_DIR: /data
      ZO_HTTP_ADDR: 0.0.0.0
      ZO_HTTP_PORT: 5080
      ZO_GRPC_PORT: 5081
      ZO_WEB_URL: ${OBSERVER_SITE:?OBSERVER_SITE must be set}
      ZO_COOKIE_SECURE_ONLY: "true"
      ZO_QUERY_THREAD_NUM: ${OBSERVER_QUERY_THREAD_NUM:-1}
      ZO_HTTP_WORKER_NUM: ${OBSERVER_HTTP_WORKER_NUM:-1}
      ZO_HTTP_WORKER_MAX_BLOCKING: ${OBSERVER_HTTP_WORKER_MAX_BLOCKING:-16}
      ZO_GRPC_RUNTIME_WORKER_NUM: ${OBSERVER_GRPC_RUNTIME_WORKER_NUM:-1}
      ZO_GRPC_RUNTIME_BLOCKING_WORKER_NUM: ${OBSERVER_GRPC_RUNTIME_BLOCKING_WORKER_NUM:-16}
      ZO_JOB_RUNTIME_WORKER_NUM: ${OBSERVER_JOB_RUNTIME_WORKER_NUM:-1}
      ZO_JOB_RUNTIME_BLOCKING_WORKER_NUM: ${OBSERVER_JOB_RUNTIME_BLOCKING_WORKER_NUM:-16}
      ZO_WAL_RUNTIME_WORKER_NUM: ${OBSERVER_WAL_RUNTIME_WORKER_NUM:-1}
      ZO_MEMORY_CACHE_ENABLED: "false"
      ZO_DISK_CACHE_ENABLED: "true"
      ZO_DISK_CACHE_MAX_SIZE: ${OBSERVER_DISK_CACHE_MAX_SIZE:-128}
      ZO_ENABLE_INVERTED_INDEX: ${OBSERVER_ENABLE_INVERTED_INDEX:-false}
      ZO_WAL_WRITE_QUEUE_SIZE: ${OBSERVER_WAL_WRITE_QUEUE_SIZE:-1000}
      ZO_COMPACT_INTERVAL: ${OBSERVER_COMPACT_INTERVAL:-30}
      ZO_COMPACT_DATA_RETENTION_INTERVAL: ${OBSERVER_COMPACT_DATA_RETENTION_INTERVAL:-3600}
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OBSERVER_DATA_RETENTION_DAYS:-30}
      ZO_COMPACT_TANTIVY_BUILDER_THREAD_NUM: ${OBSERVER_COMPACT_TANTIVY_BUILDER_THREAD_NUM:-1}
    volumes:
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/observer:/data
    networks: [observer_private, platform_edge]
  observer-log-proxy:
    image: ${OBSERVER_LOG_PROXY_IMAGE:?OBSERVER_LOG_PROXY_IMAGE must be digest-pinned}
    restart: unless-stopped
    mem_limit: ${OBSERVER_LOG_PROXY_MEMORY_LIMIT:-32m}
    cpus: ${OBSERVER_LOG_PROXY_CPUS:-0.10}
    pids_limit: ${OBSERVER_LOG_PROXY_PIDS_LIMIT:-64}
    read_only: true
    security_opt: ['no-new-privileges:true']
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      ALLOW_LOGS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs: [/run, /tmp]
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: app-observer
      com.aichorage.observer.ignore-logs: "true"
    networks: [observer_private]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2375/_ping | grep -qx OK"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  observer-log-shipper:
    image: ${OBSERVER_LOG_SHIPPER_IMAGE:?OBSERVER_LOG_SHIPPER_IMAGE must be digest-pinned}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: ${OBSERVER_LOG_SHIPPER_MEMORY_LIMIT:-96m}
    cpus: ${OBSERVER_LOG_SHIPPER_CPUS:-0.10}
    pids_limit: ${OBSERVER_LOG_SHIPPER_PIDS_LIMIT:-128}
    read_only: true
    security_opt: ['no-new-privileges:true']
    environment:
      VECTOR_CONFIG: /etc/vector/vector.toml
      NODE_ID: ${NODE_ID:?NODE_ID must be set}
      OBSERVER_ROOT_USER_EMAIL: ${OBSERVER_ROOT_USER_EMAIL:?OBSERVER_ROOT_USER_EMAIL must be set}
      OBSERVER_ROOT_USER_PASSWORD: ${OBSERVER_ROOT_USER_PASSWORD:?OBSERVER_ROOT_USER_PASSWORD must be set}
      OBSERVER_LOG_ORGANIZATION: ${OBSERVER_LOG_ORGANIZATION:-default}
      OBSERVER_LOG_STREAM: ${OBSERVER_LOG_STREAM:-docker}
      OBSERVER_LOG_BUFFER_MAX_BYTES: ${OBSERVER_LOG_BUFFER_MAX_BYTES:-8589934592}
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - ${DATA_ROOT:-/opt/apps/llm-hub-lite/shared/data/prod}/observer/log-buffer:/var/lib/vector
    networks: [observer_private]
    depends_on:
      observer:
        condition: service_started
      observer-log-proxy:
        condition: service_healthy
    labels:
      com.aichorage.platform: llm-hub-lite
      com.aichorage.component: app-observer
      com.aichorage.observer.ignore-logs: "true"
    tmpfs: [/tmp]
    command: ["--config", "/etc/vector/vector.toml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8686/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
networks:
  observer_private:
    name: app-observer_private
  platform_edge:
    name: ${PLATFORM_EDGE_NETWORK:-platform_edge}
    external: true

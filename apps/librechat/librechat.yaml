version: 1.3.14
cache: true
fileStrategy: "s3"
interface:
  fileSearch: false
  marketplace:
    use: false
  agents:
    use: true
    create: true
    share: false
    public: false
endpoints:
  assistants:
    capabilities: [actions, tools, image_vision]
  agents:
    recursionLimit: 10
    maxRecursionLimit: 20
    maxSubagents: 2
    skills:
      maxCatalogSkills: 10
    capabilities:
      - deferred_tools
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - chain
      - ocr

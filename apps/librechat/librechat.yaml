version: 1.3.14
cache: true
fileStrategy: "s3"
interface:
  fileSearch: false
  marketplace:
    use: false
  agents:
    use: true
    create: true
    share: false
    public: false
endpoints:
  assistants:
    capabilities: [actions, tools, image_vision]
  agents:
    recursionLimit: 10
    maxRecursionLimit: 20
    maxSubagents: 2
    skills:
      maxCatalogSkills: 10
    capabilities:
      - deferred_tools
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - chain
      - ocr
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        x-librechat-body-parentmessageid: "{{LIBRECHAT_BODY_PARENTMESSAGEID}}"
      models:
        default: ["openrouter/free"]
        fetch: false
      titleConvo: true
      titleModel: "openrouter/free"
      dropParams: ["stop"]
      modelDisplayLabel: "OpenRouter"
